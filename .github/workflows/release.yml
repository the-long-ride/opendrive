name: Release
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag (e.g. v0.1.0). Enter when running on main; omit if running on a tag.'
        required: false
        type: string

  workflow_call:
    inputs:
      artifact_only:
        description: 'Build artifacts without creating a GitHub release'
        type: boolean
        default: false
      build_windows:
        type: boolean
        default: true
      build_linux:
        type: boolean
        default: true
      build_macos:
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
      version: ${{ steps.ver.outputs.version }}
      ref_sha: ${{ steps.ver.outputs.ref_sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: ver
        name: Validate release tag and resolve commit
        shell: bash
        env:
          ARTIFACT_ONLY: ${{ inputs.artifact_only }}
          REQUESTED_TAG: ${{ inputs.tag }}
          REF_TYPE: ${{ github.ref_type }}
        run: bash scripts/release-gate.sh

  build-windows:
    if: ${{ !inputs.artifact_only || inputs.build_windows }}
    needs: gate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.gate.outputs.ref_sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - run: cargo build -p opendrive-app --release --locked --target x86_64-pc-windows-msvc
      - name: Package portable ZIP and NSIS installer
        shell: pwsh
        run: |
          $tag = "${{ needs.gate.outputs.tag }}"
          $ver = "${{ needs.gate.outputs.version }}"
          $bin = "target/x86_64-pc-windows-msvc/release/opendrive.exe"
          New-Item -ItemType Directory -Force dist/portable | Out-Null
          Copy-Item $bin dist/portable/opendrive.exe
          Copy-Item README.md, PRIVACY.md dist/portable/
          Compress-Archive -Path dist/portable/* -DestinationPath "dist/opendrive-$tag-windows-x86_64-portable.zip" -Force

          $makensis = Get-Command makensis -ErrorAction SilentlyContinue
          if (-not $makensis -and (Test-Path "C:\Program Files (x86)\NSIS\makensis.exe")) {
            $env:PATH += ";C:\Program Files (x86)\NSIS"
            $makensis = Get-Command makensis -ErrorAction SilentlyContinue
          }
          if (-not $makensis) {
            choco install nsis -y
            $env:PATH += ";C:\Program Files (x86)\NSIS"
          }
          @'
          !define APPNAME "OpenDrive"
          !define VERSION "__VER__"
          Name "${APPNAME} ${VERSION}"
          OutFile "dist\opendrive-__TAG__-windows-x86_64-setup.exe"
          Icon "docs\assets\opendrive.ico"
          UninstallIcon "docs\assets\opendrive.ico"
          InstallDir "$LOCALAPPDATA\OpenDrive"
          RequestExecutionLevel user
          Page directory
          Page instfiles
          UninstPage uninstConfirm
          UninstPage instfiles
          Section "Install"
            SetOutPath "$INSTDIR"
            File "dist\portable\opendrive.exe"
            File "README.md"
            File "PRIVACY.md"
            WriteUninstaller "$INSTDIR\Uninstall.exe"
            CreateShortCut "$DESKTOP\OpenDrive.lnk" "$INSTDIR\opendrive.exe"
            CreateDirectory "$SMPROGRAMS\OpenDrive"
            CreateShortCut "$SMPROGRAMS\OpenDrive\OpenDrive.lnk" "$INSTDIR\opendrive.exe"
            CreateShortCut "$SMPROGRAMS\OpenDrive\Uninstall.lnk" "$INSTDIR\Uninstall.exe"
          SectionEnd
          Section "Uninstall"
            Delete "$DESKTOP\OpenDrive.lnk"
            RMDir /r "$SMPROGRAMS\OpenDrive"
            RMDir /r "$INSTDIR"
          SectionEnd
          '@.Replace("__VER__", $ver).Replace("__TAG__", $tag) | Set-Content -Encoding UTF8 installer.nsi
          makensis installer.nsi
      - uses: actions/upload-artifact@v4
        with:
          name: assets-windows
          path: |
            dist/opendrive-*-windows-x86_64-portable.zip
            dist/opendrive-*-windows-x86_64-setup.exe

  build-linux:
    if: ${{ !inputs.artifact_only || inputs.build_linux }}
    needs: gate
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.gate.outputs.ref_sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libdbus-1-dev libfuse3-dev
      - run: cargo build -p opendrive-app --release --locked --target x86_64-unknown-linux-gnu
      - name: Package tarball, Debian (.deb), and AppImage
        shell: bash
        run: |
          TAG="${{ needs.gate.outputs.tag }}"
          VER="${{ needs.gate.outputs.version }}"
          BIN="target/x86_64-unknown-linux-gnu/release/opendrive"
          mkdir -p dist/portable
          cp "$BIN" README.md PRIVACY.md dist/portable/
          cp docs/assets/opendrive-logo.svg dist/portable/opendrive.svg
          cp docs/assets/opendrive-logo.png dist/portable/opendrive.png
          cat > dist/portable/opendrive.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=OpenDrive
          Exec=opendrive
          Icon=opendrive
          Categories=Network;FileTransfer;
          Terminal=false
          EOF
          tar -C dist/portable -czf "dist/opendrive-${TAG}-linux-x86_64.tar.gz" .

          DEB_ROOT="dist/deb/opendrive_${VER}_amd64"
          mkdir -p "${DEB_ROOT}/DEBIAN" "${DEB_ROOT}/usr/bin" "${DEB_ROOT}/usr/share/applications" \
            "${DEB_ROOT}/usr/share/icons/hicolor/scalable/apps" \
            "${DEB_ROOT}/usr/share/icons/hicolor/512x512/apps" \
            "${DEB_ROOT}/usr/share/pixmaps"
          install -m 0755 "$BIN" "${DEB_ROOT}/usr/bin/opendrive"
          cp docs/assets/opendrive-logo.svg "${DEB_ROOT}/usr/share/icons/hicolor/scalable/apps/opendrive.svg"
          cp docs/assets/opendrive-logo.png "${DEB_ROOT}/usr/share/icons/hicolor/512x512/apps/opendrive.png"
          cp docs/assets/opendrive-logo.png "${DEB_ROOT}/usr/share/pixmaps/opendrive.png"
          cat > "${DEB_ROOT}/DEBIAN/control" <<EOF
          Package: opendrive
          Version: ${VER}
          Section: net
          Priority: optional
          Architecture: amd64
          Maintainer: the-long-ride
          Description: Pure-Rust multi-account Google Drive desktop client
          EOF
          cp dist/portable/opendrive.desktop "${DEB_ROOT}/usr/share/applications/opendrive.desktop"
          dpkg-deb --build "$DEB_ROOT" "dist/opendrive_${VER}_amd64.deb"

          APPDIR="dist/OpenDrive.AppDir"
          mkdir -p "${APPDIR}/usr/bin"
          install -m 0755 "$BIN" "${APPDIR}/usr/bin/opendrive"
          cp "${DEB_ROOT}/usr/share/applications/opendrive.desktop" "${APPDIR}/opendrive.desktop"
          cp docs/assets/opendrive-logo.svg "${APPDIR}/opendrive.svg"
          cp docs/assets/opendrive-logo.png "${APPDIR}/opendrive.png"
          cp docs/assets/opendrive-logo.png "${APPDIR}/.DirIcon"
          cat > "${APPDIR}/AppRun" <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/opendrive" "$@"
          EOF
          chmod +x "${APPDIR}/AppRun"
          curl -fsSL -o /tmp/appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /tmp/appimagetool
          ARCH=x86_64 /tmp/appimagetool --appimage-extract-and-run "$APPDIR" "dist/opendrive-${TAG}-linux-x86_64.AppImage"
      - uses: actions/upload-artifact@v4
        with:
          name: assets-linux
          path: |
            dist/opendrive-*-linux-x86_64.tar.gz
            dist/opendrive_*_amd64.deb
            dist/opendrive-*-linux-x86_64.AppImage

  build-macos:
    if: ${{ !inputs.artifact_only || inputs.build_macos }}
    needs: gate
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.gate.outputs.ref_sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - run: cargo build -p opendrive-app --release --locked --target aarch64-apple-darwin
      - name: Package portable ZIP and DMG installer
        shell: bash
        run: |
          TAG="${{ needs.gate.outputs.tag }}"
          VER="${{ needs.gate.outputs.version }}"
          BIN="target/aarch64-apple-darwin/release/opendrive"
          ICONSET="dist/AppIcon.iconset"
          mkdir -p "$ICONSET"
          for sz in 16 32 128 256 512; do
            sips -z "$sz" "$sz" docs/assets/opendrive-logo.png --out "$ICONSET/icon_${sz}x${sz}.png" >/dev/null
          done
          for sz in 16 32 128 256 512; do
            dbl=$((sz * 2))
            sips -z "$dbl" "$dbl" docs/assets/opendrive-logo.png --out "$ICONSET/icon_${sz}x${sz}@2x.png" >/dev/null
          done
          iconutil -c icns "$ICONSET" -o dist/AppIcon.icns

          APP_DIR="dist/dmg/OpenDrive.app"
          mkdir -p "${APP_DIR}/Contents/MacOS" "${APP_DIR}/Contents/Resources"
          cp "$BIN" "${APP_DIR}/Contents/MacOS/opendrive"
          chmod +x "${APP_DIR}/Contents/MacOS/opendrive"
          cp dist/AppIcon.icns "${APP_DIR}/Contents/Resources/AppIcon.icns"
          cat > "${APP_DIR}/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>OpenDrive</string>
            <key>CFBundleIdentifier</key><string>dev.opendrive.app</string>
            <key>CFBundleVersion</key><string>${VER}</string>
            <key>CFBundleShortVersionString</key><string>${VER}</string>
            <key>CFBundleExecutable</key><string>opendrive</string>
            <key>CFBundleIconFile</key><string>AppIcon</string>
            <key>CFBundlePackageType</key><string>APPL</string>
          </dict></plist>
          EOF

          mkdir -p dist/portable
          cp -R "${APP_DIR}" dist/portable/OpenDrive.app
          cp README.md PRIVACY.md dist/portable/
          ditto -c -k --keepParent dist/portable "dist/opendrive-${TAG}-macos-arm64-portable.zip"

          ln -s /Applications dist/dmg/Applications
          hdiutil create -volname "OpenDrive ${TAG}" -srcfolder dist/dmg -ov -format UDZO "dist/opendrive-${TAG}-macos-arm64-installer.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: assets-macos
          path: |
            dist/opendrive-*-macos-arm64-portable.zip
            dist/opendrive-*-macos-arm64-installer.dmg

  publish:
    if: ${{ !inputs.artifact_only }}
    needs: [gate, build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.gate.outputs.ref_sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Generate checksums, release notes, and publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.gate.outputs.tag }}
          VERSION: ${{ needs.gate.outputs.version }}
          REF_SHA: ${{ needs.gate.outputs.ref_sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_API_URL: ${{ github.api_url }}
          OUTPUT_PATH: release-notes.md
        shell: bash
        run: |
          (cd release-assets && sha256sum * > SHA256SUMS.txt)
          node scripts/generate-release-notes.mjs

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "OpenDrive ${TAG}" --notes-file release-notes.md
            gh release upload "$TAG" release-assets/* --clobber
          else
            gh release create "$TAG" release-assets/* --target "$REF_SHA" --title "OpenDrive ${TAG}" --notes-file release-notes.md
          fi
